#fff;font-size:15px;font-weight:700}.course-status{min-height:20px;margin:9px 0 0;color:#087f73;font-size:12px;text-align:center}@media(max-width:350px){.leader-card{grid-template-columns:92px minmax(0,1fr);gap:10px}.leader-card img{width:92px;height:120px}.leader-card h3{font-size:15px}}

<body><script>window.EP_PAGE='R01'</script><header class="v3-top"><button class="v3-back" aria-label="返回读书会" onclick="v3Go('2')"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><div class="v3-top-copy"><h1>来做领读员</h1><p>图文课程 · 视频课程 · 领读实践</p></div><span class="v3-badge">演示数据</span></header>
<main class="v3-shell">
<p class="leader-intro">面向教师、家长和校园阅读组织者，提供可直接阅读的图文方法课，以及课堂示范视频。</p>
<div class="leader-search" role="search"><span class="material-symbols-outlined" aria-hidden="true">search</span><input id="course-search-input" type="search" autocomplete="off" placeholder="搜索课程、讲师或阅读关键词" aria-label="搜索领读员课程"><button id="course-search-clear" type="button" aria-label="清空搜索" hidden><span class="material-symbols-outlined">close</span></button></div>
<div class="leader-results" aria-live="polite"><span>领读员课程</span><strong id="course-result-count">共 6 门</strong></div>
<section class="leader-list" id="course-list" aria-label="领读员课程列表">
<button class="leader-card" data-course-id="t1" data-search="图文 整本书 导读 开场 设计 张远明 领读方法" type="button"><img src="../assets/v3/campus-reading-v2.jpg" alt="师生进行整本书共读的图文课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format"><span class="material-symbols-outlined" aria-hidden="true">article</span>图文课程</span><span class="leader-duration">约8分钟</span></span><h3>整本书导读课：怎样设计一个有吸引力的开场</h3><p>从问题、人物和冲突出发，完成一份可直接使用的导读开场。</p><span class="leader-card-foot"><span>张远明 · 语文教研员</span><span>阅读全文</span></span></span></button>
<button class="leader-card" data-course-id="t2" data-search="图文 共读 提问 深度阅读 陈明礼 阅读方法" type="button"><img src="../assets/v3/reading-campus.jpg" alt="学生讨论阅读问题的图文课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format"><span class="material-symbols-outlined" aria-hidden="true">article</span>图文课程</span><span class="leader-duration">约10分钟</span></span><h3>共读讨论怎么问：从情节复述走向观点表达</h3><p>用事实、推断、判断三层问题，引导学生形成自己的阅读观点。</p><span class="leader-card-foot"><span>陈明礼 · 语文特级教师</span><span>阅读全文</span></span></span></button>
<button class="leader-card" data-course-id="t3" data-search="图文 读后感 写作 评价 反馈 何老师" type="button"><img src="../assets/v3/campus-view.jpg" alt="校园读后感写作指导图文课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format"><span class="material-symbols-outlined" aria-hidden="true">article</span>图文课程</span><span class="leader-duration">约7分钟</span></span><h3>怎样指导一篇有真实感受的读后感</h3><p>从一个触动自己的细节写起，建立观点、文本证据与生活经验的联系。</p><span class="leader-card-foot"><span>何老师 · 阅读指导教师</span><span>阅读全文</span></span></span></button>
<button class="leader-card" data-course-id="v1" data-search="视频 整本书 课堂 实践 张远明 领读示范" type="button"><img src="../assets/v3/public-class.jpg" alt="教师开展整本书阅读课堂的视频课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format video"><span class="material-symbols-outlined" aria-hidden="true">play_circle</span>视频课程</span><span class="leader-duration">42分钟</span></span><h3>整本书阅读领读策略与课堂实践</h3><p>示范如何组织导读、共读讨论与成果表达三个课堂环节。</p><span class="leader-card-foot"><span>张远明 · 语文教研员</span><span>观看课程</span></span></span></button>
<button class="leader-card" data-course-id="v2" data-search="视频 青少年 心理 共读 引导 孙老师" type="button"><img src="../assets/v3/university-life-v2.jpg" alt="师生共同阅读交流的视频课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format video"><span class="material-symbols-outlined" aria-hidden="true">play_circle</span>视频课程</span><span class="leader-duration">36分钟</span></span><h3>青少年共读中的情绪回应与讨论引导</h3><p>识别阅读讨论中的沉默、分歧和情绪反应，建立安全的表达环境。</p><span class="leader-card-foot"><span>孙老师 · 阅读心理教师</span><span>观看课程</span></span></span></button>
<button class="leader-card" data-course-id="v3" data-search="视频 班级 读书会 活动 组织 钱思齐" type="button"><img src="../assets/v3/campus-reading-v2.jpg" alt="班级读书会活动组织的视频课程配图"><span class="leader-card-copy"><span class="leader-card-meta"><span class="leader-format video"><span class="material-symbols-outlined" aria-hidden="true">play_circle</span>视频课程</span><span class="leader-duration">31分钟</span></span><h3>班级读书会活动的组织与现场推进</h3><p>从分组、任务单到成果展示，完成一次班级共读活动。</p><span class="leader-card-foot"><span>钱思齐 · 一线语文教师</span><span>观看课程</span></span></span></button>
</section>
<div class="leader-empty" id="course-empty" hidden><span class="material-symbols-outlined" aria-hidden="true">manage_search</span><p>暂未找到相关课程，请更换课程名、讲师或关键词。</p></div>
<div class="v3-note info">课程名称、讲师和图片均为原型测试数据；正式发布前需完成课程审核与内容授权。</div>
</main>
<div class="course-sheet" id="course-sheet" role="dialog" aria-modal="true" aria-labelledby="course-sheet-title" hidden><button class="course-sheet-backdrop" type="button" aria-label="关闭课程详情"></button><section class="course-sheet-panel"><div class="course-sheet-handle"></div><div class="course-sheet-head"><div><small id="course-sheet-type">图文课程</small><h2 id="course-sheet-title">课程标题</h2></div><button class="course-sheet-close" type="button" aria-label="关闭课程详情"><span class="material-symbols-outlined">close</span></button></div><div class="course-sheet-summary" id="course-sheet-summary"></div><ul class="course-sheet-points" id="course-sheet-points"></ul><button class="course-sheet-action" id="course-sheet-action" type="button">开始学习</button><p class="course-status" id="course-status" role="status" aria-live="polite"></p></section></div>
<script>
(()=>{const courses={
t1:{type:'图文课程',title:'整本书导读课：怎样设计一个有吸引力的开场',summary:'一篇可直接阅读的领读方法课，从书目核心矛盾出发，帮助领读员设计第一场共读活动。',points:['用一句核心问题建立阅读期待','选择人物冲突作为讨论入口','制作一页式导读任务单'],action:'阅读图文课程'},
t2:{type:'图文课程',title:'共读讨论怎么问：从情节复述走向观点表达',summary:'用递进问题替代标准答案，让参与者在文本证据和个人判断之间建立联系。',points:['先确认事实与关键情节','继续追问人物动机与变化','用文本证据支持个人判断'],action:'阅读图文课程'},
t3:{type:'图文课程',title:'怎样指导一篇有真实感受的读后感',summary:'从真实触动出发，完成一篇有细节、有依据、有个人经验的读后表达。',points:['选择一个最有感受的细节','说明细节为什么重要','连接自己的真实生活经验'],action:'阅读图文课程'},
v1:{type:'视频课程',title:'整本书阅读领读策略与课堂实践',summary:'课堂实录演示，展示导读、共读讨论和成果表达的完整流程。',points:['导读开场示范','课堂提问与追问','成果展示组织'],action:'观看视频课程'},
v2:{type:'视频课程',title:'青少年共读中的情绪回应与讨论引导',summary:'通过典型课堂片段，演示如何回应沉默、分歧和情绪表达。',points:['建立安全讨论规则','回应不同阅读感受','处理讨论中的分歧'],action:'观看视频课程'},
v3:{type:'视频课程',title:'班级读书会活动的组织与现场推进',summary:'从活动准备到现场组织，演示一次完整班级读书会的执行过程。',points:['设计分组与角色','准备活动任务单','组织分享与成果展示'],action:'观看视频课程'}};
const input=document.getElementById('course-search-input'),clear=document.getElementById('course-search-clear'),count=document.getElementById('course-result-count'),cards=[...document.querySelectorAll('[data-course-id]')],empty=document.getElementById('course-empty'),sheet=document.getElementById('course-sheet'),status=document.getElementById('course-status');
const filter=()=>{const q=input.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const show=!q||(card.dataset.search||'').toLowerCase().includes(q);card.hidden=!show;if(show)visible++});count.textContent=q?`找到 ${visible} 门`:`共 ${cards.length} 门`;clear.hidden=!q;empty.hidden=visible!==0};
const close=()=>{sheet.hidden=true;document.body.style.overflow='';status.textContent=''};
const open=id=>{const course=courses[id];if(!course)return;document.getElementById('course-sheet-type').textContent=course.type;document.getElementById('course-sheet-title').textContent=course.title;document.getElementById('course-sheet-summary').textContent=course.summary;document.getElementById('course-sheet-points').innerHTML=course.points.map(point=>`<li>${point}</li>`).join('');document.getElementById('course-sheet-action').textContent=course.action;sheet.hidden=false;document.body.style.overflow='hidden'};
cards.forEach(card=>card.addEventListener('click',()=>open(card.dataset.courseId)));input.addEventListener('input',filter);input.addEventListener('keydown',event=>{if(event.key==='Escape'){input.value='';filter()}});clear.addEventListener('click',()=>{input.value='';filter();input.focus()});sheet.querySelectorAll('.course-sheet-backdrop,.course-sheet-close').forEach(button=>button.addEventListener('click',close));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!sheet.hidden)close()});document.getElementById('course-sheet-action').addEventListener('click',()=>{status.textContent='课程内容正在载入（演示）'});})();
</script>
