<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>少年派作品投稿｜教育Plus V3.0</title><link rel="stylesheet" href="../v3.css?v=20260922-v3c21"></head>
<body><script>window.EP_PAGE='S02'</script><header class="v3-top"><button class="v3-back" aria-label="返回少年派" onclick="v3Go('3')"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><div class="v3-top-copy"><h1>少年派作品投稿</h1><p>写作营 · 才艺坊</p></div><span class="v3-badge">演示数据</span></header><main class="v3-shell">
<section class="v3-panel"><div class="v3-kicker"><span class="material-symbols-outlined">edit_note</span>填写投稿信息</div>
<form class="v3-form" id="youthForm">
<div class="v3-field"><label for="workType">投稿板块</label><select id="workType" required><option value="">请选择</option><option>写作营｜散文 / 诗歌 / 评论</option><option>才艺坊｜书法 / 绘画 / 摄影</option><option>活动专区｜赛事专项作品</option></select></div>
<div class="v3-field"><label for="eventName">参与活动</label><select id="eventName" required><option>第四届贵州省青少年新时代征文大赛</option><option>少年派日常作品展示</option></select></div>
<div class="v3-field"><label for="workTitle">作品标题</label><input id="workTitle" required maxlength="40" placeholder="请输入作品标题"></div>
<div class="v3-field"><label for="workBody">正文或作品说明</label><textarea id="workBody" required placeholder="写作作品填写正文；书画作品填写创作说明"></textarea></div>
<label class="v3-upload" for="workFile"><span class="material-symbols-outlined">upload_file</span><strong id="fileLabel">上传文稿或清晰作品图片</strong><br><small>支持 DOC、PDF、JPG、PNG（原型演示）</small></label><input id="workFile" type="file" hidden required accept=".doc,.docx,.pdf,.jpg,.jpeg,.png">
<div class="v3-grid">
<div class="v3-field"><label for="studentName">学生姓名</label><input id="studentName" required placeholder="真实姓名"></div>
<div class="v3-field"><label for="studentGrade">年级班级</label><input id="studentGrade" required placeholder="如：初二（3）班"></div></div>
<div class="v3-field"><label for="studentSchool">学校</label><input id="studentSchool" required placeholder="请输入学校全称"></div>
<label class="v3-check"><input id="originalCheck" type="checkbox" required><span>本人确认作品为原创，并同意提交后由编辑审核展示。</span></label>
<button class="v3-btn" type="submit">提交审核</button></form></section>
<div class="v3-note info">本页面演示投稿流程，不会上传文件或产生费用。</div>
<script>
const form=document.getElementById('youthForm'),file=document.getElementById('workFile'),label=document.getElementById('fileLabel');
file.addEventListener('change',()=>label.textContent=file.files[0]?.name||'上传文稿或清晰作品图片');
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;localStorage.setItem('ep-youth-submission',JSON.stringify({title:document.getElementById('workTitle').value,type:document.getElementById('workType').value,status:'待审核',time:Date.now()}));v3Toast('作品已提交，正在进入审核（演示）');setTimeout(()=>v3Go('S04'),700)});
</script>
</main>
<footer class="v3-footer"><button onclick="v3Go('1')" aria-label="首页"><span class="material-symbols-outlined">home</span><span>首页</span></button><button class="active" onclick="v3Go('11')" aria-label="服务"><span class="material-symbols-outlined">apps</span><span>服务</span></button><button onclick="v3Go('12')" aria-label="活动"><span class="material-symbols-outlined">event</span><span>活动</span></button><button onclick="v3Go('10')" aria-label="我的"><span class="material-symbols-outlined">person</span><span>我的</span></button></footer>
<script src="../v3-ui.js?v=20260922-v3c21"></script><script src="../access-control.js?v=20260922-content-media-v1"></script><script src="../routes.js?v=20260922-v3c21"></script></body></html>
