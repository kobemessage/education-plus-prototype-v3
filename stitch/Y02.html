<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>社团入驻申请</title>
  <link rel="stylesheet" href="../youth.css?v=20260923-no-floating-panels-v3">
  <link rel="stylesheet" href="../v3.css?v=20260923-no-floating-panels-v3">
</head>
<body>
  <header class="topbar">
    <button class="back" aria-label="返回致青春" onclick="youthGo(5)">‹</button>
    <div class="heading"><h1>社团入驻申请</h1><p>缤纷社团 · 高校社团入驻功能</p></div>
    <span class="more">•••</span>
  </header>
  <main class="page">
    <div class="notice"><b>入驻说明</b><br>社团负责人提交基础资料后，由平台进行资质审核。审核通过后可完善社团主页、发布动态和招新信息。</div>
    <section class="card process-card">
      <div class="section-head"><h2>申请进度</h2><span class="tag" id="clubStatusTag">未提交</span></div>
      <div class="feature-grid">
        <div class="feature"><b>1. 填写资料</b><p>学校、社团和联系人信息</p></div>
        <div class="feature"><b>2. 提交证明</b><p>校内登记或指导教师信息</p></div>
        <div class="feature"><b>3. 平台审核</b><p>核验资料并反馈结果</p></div>
        <div class="feature"><b>4. 完善主页</b><p>审核通过后发布社团内容</p></div>
      </div>
    </section>
    <form class="card" id="clubOnboardingForm" onsubmit="submitClubOnboarding(event)">
      <div class="section-head"><h2>社团资料</h2><small>带 * 为必填项</small></div>
      <div class="form-group"><label for="clubSchool">学校名称 <span class="required">*</span></label><input id="clubSchool" required placeholder="请输入学校全称"></div>
      <div class="form-group"><label for="clubName">社团名称 <span class="required">*</span></label><input id="clubName" required placeholder="请输入社团正式名称"></div>
      <div class="form-group"><label for="clubCategory">社团类别 <span class="required">*</span></label><select id="clubCategory" required><option value="">请选择类别</option><option>文化艺术</option><option>学术科技</option><option>体育运动</option><option>志愿公益</option><option>创新创业</option><option>其他</option></select></div>
      <div class="form-group"><label for="clubLead">负责人姓名 <span class="required">*</span></label><input id="clubLead" required placeholder="请输入负责人姓名"></div>
      <div class="form-group"><label for="clubRole">负责人身份 <span class="required">*</span></label><select id="clubRole" required><option value="">请选择身份</option><option>社团学生负责人</option><option>指导教师</option><option>学校管理人员</option></select></div>
      <div class="form-group"><label for="clubContact">联系电话 <span class="required">*</span></label><input id="clubContact" required inputmode="tel" pattern="1[3-9][0-9]{9}" placeholder="请输入11位手机号"></div>
      <div class="form-group"><label for="clubIntro">社团简介 <span class="required">*</span></label><textarea id="clubIntro" required maxlength="300" placeholder="请介绍社团定位、主要活动和特色，300字以内"></textarea></div>
      <div class="form-group"><label>证明材料 <span class="required">*</span></label><div class="upload" id="clubUpload" role="button" tabindex="0" onclick="simulateClubUpload()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();simulateClubUpload()}"><b id="clubUploadText">上传校内登记或指导教师证明</b><div class="meta">支持图片或 PDF；原型仅演示选择状态</div></div><input id="clubUploadState" type="hidden" value=""></div>
      <label class="check"><input type="checkbox" required aria-label="确认信息真实并获得学校或指导教师同意"><span>我确认所填信息真实，并已获得学校或指导教师同意。<span class="required">*</span></span></label>
      <button class="btn block" id="clubSubmitButton" type="submit" style="margin-top:18px">提交入驻申请</button>
    </form>
    <p class="intro">当前为交互原型，提交结果保存在本机浏览器，不会上传真实资料。正式审核时效与材料清单待平台确认。</p>
  </main>
  <div class="toast"></div>
  <script>window.EP_PAGE='Y02'</script><script src="../youth.js"></script><script src="../access-control.js?v=20260924-content-actions-v1"></script><script src="../routes.js?v=20260922-v3c21"></script><script src="../v3-overrides.js?v=20260922-v3c21"></script>
</body>
</html>
