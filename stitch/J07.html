<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小记者资格申请｜教育Plus V3.0</title><link rel="stylesheet" href="../v3.css"></head><body><script>window.EP_PAGE='J07'</script><header class="v3-top"><button class="v3-back" onclick="v3Go('1')">‹</button><h1>小记者资格申请</h1><span class="v3-badge">[演示数据]</span></header><main class="v3-shell">
<section class="v3-hero"><small>独立资格审核</small><h2>申请成为校园小记者</h2><p>普通微信账号仅用于登录；小记者资格需另行提交并由后台教研人员核验。</p></section><form class="v3-card v3-form" onsubmit="return v3Submit(this,'申请已提交，等待后台核验（演示）')"><div class="v3-field"><label>学生真实姓名</label><input required placeholder="请输入学生姓名"></div><div class="v3-field"><label>学校全称</label><input required placeholder="请输入学校全称"></div><div class="v3-field"><label>所在年级</label><select required><option value="">请选择</option><option>小学四年级</option><option>小学五年级</option><option>小学六年级</option><option>初中一年级</option></select></div><div class="v3-field"><label>监护人姓名</label><input required placeholder="请输入监护人姓名"></div><div class="v3-field"><label>监护人联系方式</label><input required inputmode="tel" pattern="1[3-9][0-9]{9}" placeholder="11位手机号"></div><div class="v3-upload">＋ 上传学校少先队 / 教务处盖章推荐材料<br><small>支持照片或 PDF（原型演示，不会实际上传）</small></div><label style="font-size:12px"><input type="checkbox" required> 已阅读资格审核与隐私说明</label><button class="v3-btn" type="submit">提交资格申请</button></form><div class="v3-note">本资格只用于校园采写身份审核，不承诺升学加分、线下研学、实践学时或商业权益。</div></main><footer class="v3-footer"><button class="" onclick="v3Go('1')"><b>⌂</b>首页</button><button class="" onclick="v3Go('11')"><b>▦</b>服务</button><button class="" onclick="v3Go('12')"><b>◇</b>活动</button><button class="active" onclick="v3Go('10')"><b>○</b>我的</button></footer><script src="../v3-ui.js"></script><script src="../routes.js"></script></body></html>
