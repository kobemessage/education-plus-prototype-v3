in:9px 0 0;color:#087f73;font-size:12px;text-align:center}.article-summary{margin:24px 0;padding:20px;border-radius:22px;background:linear-gradient(145deg,#087f73,#126e64);color:#fff}.article-summary small{font-size:11px;font-weight:800}.article-summary h3{margin:8px 0;font-size:21px;line-height:1.45}.article-summary p{margin:0;color:rgba(255,255,255,.82);font-size:14px;line-height:1.75}.article-related{margin-top:26px}.article-related h3{margin:0 0 11px;font-size:19px}.article-related-grid{display:grid;gap:10px}.article-related button{display:grid;grid-template-columns:76px minmax(0,1fr) 22px;align-items:center;gap:11px;width:100%;padding:10px;border:1px solid #dce9e4;border-radius:17px;background:#fff;color:#173f36;text-align:left}.article-related img{width:76px;height:76px;border-radius:12px;object-fit:cover}.article-related strong{display:block;font-size:14px;line-height:1.5}.article-related small{display:block;margin-top:4px;color:#758982;font-size:11px}.article-related .material-symbols-outlined{color:#7d978f}.article-note{margin-top:18px;padding:12px 14px;border-radius:14px;background:#edf6f2;color:#637a73;font-size:11px;line-height:1.65}@media(max-width:350px){.article-cover{height:190px}.article-head h2{font-size:23px}.article-goals{gap:6px}.article-goal{padding:10px 4px}.article-section-title h3{font-size:18px}}
</style></head>
<body><script>window.EP_PAGE='R02'</script>

<main class="v3-shell article-shell">

<header class="article-head"><h2 id="article-title"></h2><p class="article-deck" id="article-deck"></p><div class="article-meta"><strong id="article-teacher"></strong><span id="article-role"></span><span id="article-time"></span></div></header>

<script>
(()=>{const courses={
t1:{title:'整本书导读课：怎样设计一个有吸引力的开场',deck:'从问题、人物和冲突出发，让学生在翻开第一页之前就产生真正的阅读期待。',teacher:'张远明',role:'语文教研员（演示）',time:'阅读约 8 分钟',image:'../assets/v3/campus-reading-v2.jpg',problem:'导读课经常变成作者介绍和内容预告，信息很多，却没有给学生留下“我想读下去”的问题。本课用一条核心问题、一个人物选择和一张轻量任务单，完成第一次共读开场。',goals:[['help_center','找到问题','提炼全书核心矛盾'],['forum','设计开场','让学生先表达判断'],['edit_note','带走任务单','课后可直接复用']],steps:[
['第一步','不要先讲答案，先找到全书最值得追问的问题',['先把这本书压缩成一个没有标准答案的问题。它要能覆盖主要人物的选择，也要让学生愿意用自己的经验回答。','例如阅读《平凡的世界》时，与其问“小说讲了什么”，不如问：“当生活条件有限时，一个人靠什么保住自己的尊严？”'],'开场问题：如果努力不一定立刻改变生活，我们为什么还要努力？先请每位同学用一句话回答，再把答案保留到阅读结束。','好问题不负责考查记忆，它负责制造阅读期待。'],
['第二步','用一个关键选择，把学生带到人物身边',['选择作品中一个人物必须作出决定的时刻，但不要提前公布结果。给学生足够的背景，让他们站到人物的位置上做一次选择。','领读员不急着评价答案，而是追问“你依据什么作出判断”，让学生自然开始寻找文本证据。'],null,'开场只呈现必要信息，保留人物结局和情节转折。','../assets/v3/reading-campus.jpg'],
['第三步','任务单只保留三件事，让阅读真正发生',['一张有效的导读任务单不需要铺满问题。保留人物变化、关键证据和我的判断三栏即可。','每次共读后只要求学生补充一条证据，并允许修改最初的答案。任务单记录的是思考变化，而不是标准答案。'],'任务单三栏：①人物做了什么选择；②哪一句文字支持你的理解；③读到这里，你是否改变了开场时的判断？','任务越轻，越容易贯穿整本书；记录越连续，复盘越有价值。']],checks:['写下一个没有标准答案的核心问题','选定一个人物的关键选择作为开场材料','准备“人物—证据—我的判断”三栏任务单','为第一次共读预留 10 分钟自由表达'],takeaway:'导读不是把书讲明白，而是让人愿意带着问题走进书里。',ending:'完成这三个准备动作，你已经拥有一次可执行的共读开场。课堂上先听学生怎么想，再决定接下来讲什么。'},
t2:{title:'共读讨论怎么问：从情节复述走向观点表达',deck:'用事实、推断、判断三层问题，让讨论从“发生了什么”走向“我为什么这样理解”。',teacher:'陈明礼',role:'语文特级教师（演示）',time:'阅读约 10 分钟',image:'../assets/v3/reading-campus.jpg',problem:'共读讨论容易停留在情节复述，少数学生回答，大多数学生等待“正确答案”。本课提供三层问题链，让每个人都能从文本证据出发形成观点。',goals:[['fact_check','确认事实','建立共同讨论基础'],['psychology_alt','推进推断','追问人物动机变化'],['record_voice_over','形成观点','用证据支持判断']],steps:[
['第一层','事实问题：让所有人先站在同一页上',['事实问题只确认文本明确写出的信息，包括人物、事件、地点和直接结果。它不是讨论终点，而是为后续推断准备共同材料。','控制在一到两个问题内，并请学生指出原文位置。'],'人物在这一章做出了什么决定？文本中哪一句话最直接地说明了这个决定？','事实问题过多会把讨论变成检查作业。'],
['第二层','推断问题：把“发生了什么”变成“为什么”',['推断问题要求学生连接多个细节，解释人物动机、关系或变化。不同答案可以并存，但必须回到文本。','领读员可以用“你从哪里看出来”“还有别的解释吗”继续追问。'],null,'先接住答案，再追问依据；不要用教师结论提前结束讨论。','../assets/v3/campus-reading-v2.jpg'],
['第三层','判断问题：让文本与个人经验发生联系',['判断问题邀请学生评价人物选择、作品价值或现实意义。它最容易产生分歧，也最需要安全的讨论规则。','鼓励学生使用“我认为……因为文本中……”的表达结构。'],'如果你处在人物的位置，会作出同样的选择吗？请用一处文本细节和一段生活经验说明理由。','可以不同意观点，但必须尊重表达者，并回应具体理由。']],checks:['准备 1 个事实问题，确认共同信息','准备 2 个推断问题，追问动机和变化','准备 1 个判断问题，连接真实经验','写下“追问依据、邀请补充、允许修改”三句主持语'],takeaway:'高质量讨论不是问题更多，而是每一次追问都把观点带回文本。',ending:'把三层问题按顺序使用，学生会从复述者逐渐成为有依据的表达者，领读员则从“公布答案”转向“组织思考”。'},
t3:{title:'怎样指导一篇有真实感受的读后感',deck:'从一个真正触动自己的细节写起，建立观点、文本证据与生活经验之间的联系。',teacher:'何老师',role:'阅读指导教师（演示）',time:'阅读约 7 分钟',image:'../assets/v3/campus-view.jpg',problem:'读后感常常只剩内容概括和空泛道理。真实的读后感需要一个明确触点：哪一处文字改变了我的感受、判断或行动。',goals:[['touch_app','找到触点','选择最有感受的细节'],['link','建立联系','文本证据连接生活'],['rate_review','完成表达','写出变化和新判断']],steps:[
['第一步','先圈出“我停下来”的那一处',['不要先确定宏大主题。请学生回到书中，圈出让自己停顿、惊讶、难过或反对的一句话、一个动作或一个场景。','真实感受往往藏在具体反应里。先描述“我为什么在这里停下来”，再提炼观点。'],'我停在人物把唯一的食物让给弟弟这一段。让我触动的不是“他很善良”，而是他明明也很饿，却没有把自己的需要放在最前面。','越具体的触点，越容易写出属于自己的感受。'],
['第二步','用文本证据解释感受从哪里来',['引用不必很长，选择能支撑观点的关键词或动作即可。接着解释：这个细节让我看见了人物怎样的处境和选择。','避免引用之后直接喊口号，至少补上一句自己的理解。'],null,'“证据 + 我的解释”比大段摘抄更有力量。','../assets/v3/campus-reading-v2.jpg'],
['第三步','写清楚阅读前后，我发生了什么变化',['把文本和一段真实经历连接起来，说明自己以前怎么想、读完后多看见了什么、以后可能怎么做。','变化可以很小，也可以仍然保留疑问。真实比“正确”更重要。'],'我以前把让步理解成软弱，现在发现，有些让步来自一个人对关系的珍惜。但我也会继续思考：善良是否应该有边界？','允许文章以一个尚未解决的问题结束。']],checks:['圈出一处真正让自己停下来的文字','用一句话写出最直接的感受','补充一处文本证据并解释它','连接一次真实经历或保留一个新问题'],takeaway:'读后感不是替书总结道理，而是记录一本书怎样经过了我。',ending:'让学生从一个细节开始，用自己的语言完成“触点—证据—变化”，文章自然会拥有真实感和辨识度。'}};
const getCourse=()=>{const q=new URLSearchParams(location.search).get('course'),saved=sessionStorage.getItem('ep-reading-course');return [q&&courses[q]?q:null,saved&&courses[saved]?saved:null,'t1'].find(Boolean)};
function render(id=getCourse()){const c=courses[id];sessionStorage.setItem('ep-reading-course',id);document.title=c.title+'｜教育Plus V3.0';document.getElementById('article-cover').src=c.image;document.getElementById('article-cover').alt=c.title+'课程配图';document.getElementById('article-title').textContent=c.title;document.getElementById('article-deck').textContent=c.deck;document.getElementById('article-teacher').textContent=c.teacher;document.getElementById('article-role').textContent=c.role;document.getElementById('article-time').textContent=c.time;document.getElementById('article-problem').textContent=c.problem;document.getElementById('article-goals').innerHTML=c.goals.map(g=>`<article class="article-goal"><span class="material-symbols-outlined">${g[0]}</span><strong>${g[1]}</strong><small>${g[2]}</small></article>`).join('');document.getElementById('article-content').innerHTML=c.steps.map((s,i)=>`<section class="article-section" data-article-step><header class="article-section-title"><span>${i+1}</span><div><small>${s[0]}</small><h3>${s[1]}</h3></div></header>${s[2].map(p=>`<p>${p}</p>`).join('')}${s[5]?`<figure class="article-figure"><img src="${s[5]}" alt="课堂共读示例配图"><figcaption>演示场景：围绕文本证据开展共读交流。</figcaption></figure>`:''}${s[3]?`<aside class="article-example"><small>课堂示例</small><blockquote>${s[3]}</blockquote></aside>`:''}<div class="article-tip"><span class="material-symbols-outlined">tips_and_updates</span><span>${s[4]}</span></div></section>`).join('');document.getElementById('article-checks').innerHTML=c.checks.map(x=>`<button class="article-check" type="button" aria-pressed="false"><span class="material-symbols-outlined">check_circle</span><span>${x}</span></button>`).join('');document.getElementById('article-takeaway').textContent=c.takeaway;document.getElementById('article-ending').textContent=c.ending;document.getElementById('article-related').innerHTML=Object.entries(courses).filter(([k])=>k!==id).map(([k,x])=>`<button type="button" data-course-target="${k}"><img src="${x.image}" alt="${x.title}课程配图"><span><strong>${x.title}</strong><small>${x.time}</small></span><span class="material-symbols-outlined">chevron_right</span></button>`).join('');bind()}
function bind(){document.querySelectorAll('.article-check').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('done');b.setAttribute('aria-pressed',String(b.classList.contains('done')));const n=document.querySelectorAll('.article-check.done').length,t=document.querySelectorAll('.article-check').length;document.getElementById('article-sheet-status').textContent=n===t?'课前准备已完成（演示）':`已完成 ${n}/${t} 项准备`}));document.querySelectorAll('[data-course-target]').forEach(b=>b.addEventListener('click',()=>{render(b.dataset.courseTarget);scrollTo({top:0,behavior:'smooth'})}))}render()})();
</script>
