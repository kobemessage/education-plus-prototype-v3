<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>投稿进度｜教育Plus V3.0</title><link rel="stylesheet" href="../v3.css?v=20260922-v3c21"></head>
<body><script>window.EP_PAGE='S04'</script><header class="v3-top"><button class="v3-back" aria-label="返回少年派" onclick="v3Go('3')"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><div class="v3-top-copy"><h1>投稿进度</h1><p>我的作品 · 状态追踪</p></div><span class="v3-badge">演示数据</span></header><main class="v3-shell">
<div class="v3-status-filter" aria-label="投稿状态筛选"><button class="active" data-youth-status="全部">全部</button><button data-youth-status="待审核">待审核</button><button data-youth-status="需修改">需修改</button><button data-youth-status="已展示">已展示</button></div>
<div class="v3-status-list" id="submissionList">
<article class="v3-status-card" id="newSubmission" data-status="待审核" hidden><div class="v3-inline between"><span class="v3-state amber">待审核</span><small>刚刚提交</small></div><h3 id="newSubmissionTitle">新投稿作品</h3><p id="newSubmissionType">少年派投稿</p><div class="v3-actions"><button class="v3-btn secondary" onclick="v3Toast('审核中暂不可编辑（演示）')">查看材料</button></div></article>
<article class="v3-status-card" data-status="需修改"><div class="v3-inline between"><span class="v3-state amber">需修改</span><small>2025-05-18</small></div><h3>《黔山古韵硬笔行草条幅》</h3><p>请补拍平整清晰的作品图片，并修正落款错别字后重新提交。</p><div class="v3-actions"><button class="v3-btn" onclick="v3Go('S02')">补充材料</button><button class="v3-btn secondary" onclick="v3Go('S05')">查看意见</button></div></article>
<article class="v3-status-card" data-status="待审核"><div class="v3-inline between"><span class="v3-state outline">编辑审核中</span><small>2025-05-20</small></div><h3>《观山湖春行散文诗》</h3><p>材料完整，编辑正在进行原创性与内容审核。</p></article>
<article class="v3-status-card" data-status="已展示"><div class="v3-inline between"><span class="v3-state">已展示</span><small>2025-04-26</small></div><h3>《赤水丹霞秋意图》</h3><p>审核通过，已进入少年派优秀作品专题展示。</p><div class="v3-actions"><button class="v3-btn secondary" onclick="v3Go('S01')">查看作品</button></div></article>
</div>
<div class="v3-note info" id="statusCount">共 3 条演示投稿记录。</div>
<script>
const saved=JSON.parse(localStorage.getItem('ep-youth-submission')||'null');
if(saved){const card=document.getElementById('newSubmission');card.hidden=false;document.getElementById('newSubmissionTitle').textContent='《'+saved.title+'》';document.getElementById('newSubmissionType').textContent=saved.type+' · 已进入编辑审核';}
function filterYouth(status){let n=0;document.querySelectorAll('[data-status]').forEach(card=>{const show=status==='全部'||card.dataset.status===status;card.hidden=!show;if(show)n++});document.getElementById('statusCount').textContent='当前显示 '+n+' 条演示投稿记录。'}
document.querySelectorAll('[data-youth-status]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-youth-status]').forEach(x=>x.classList.toggle('active',x===btn));filterYouth(btn.dataset.youthStatus)}));
</script>
</main>
<footer class="v3-footer"><button onclick="v3Go('1')" aria-label="首页"><span class="material-symbols-outlined">home</span><span>首页</span></button><button class="active" onclick="v3Go('11')" aria-label="服务"><span class="material-symbols-outlined">apps</span><span>服务</span></button><button onclick="v3Go('12')" aria-label="活动"><span class="material-symbols-outlined">event</span><span>活动</span></button><button onclick="v3Go('10')" aria-label="我的"><span class="material-symbols-outlined">person</span><span>我的</span></button></footer>
