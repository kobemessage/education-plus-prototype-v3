<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小小发明家作品提交｜教育Plus V3.0</title><link rel="stylesheet" href="../v3.css?v=20260924-science-core-v1"></head><body><script>window.EP_PAGE='K03'</script>

<section class="v3-hero"><small>线下实践 · 线上展播</small><h2>让小创意<br>解决真问题</h2><p>提交问题观察、创意方案和模型照片，平台审核后择优展播。</p></section>
<div class="v3-note info">[演示数据] 本期活动：家乡科学发现计划。拟由科协、教育主管部门与学校共同发动，合作单位和具体安排待正式确认。</div>
