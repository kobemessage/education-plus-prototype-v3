<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>提交科学宝藏｜教育Plus V3.0</title><link rel="stylesheet" href="../v3.css?v=20260923-no-bottom-nav-v1"></head><body><script>window.EP_PAGE='K02'</script>
<header class="v3-top"><button class="v3-back" aria-label="返回科学港" onclick="v3Go('7')"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><div class="v3-top-copy"><h1>提交科学宝藏</h1><p>我是寻宝家 · 图文视频作品</p></div><span class="v3-badge">演示数据</span></header><main class="v3-shell">
<div class="v3-note info">请提交学生探访家乡科学宝藏形成的原创内容。视频支持直接上传，也支持填写已发布的视频平台链接。</div>
<form class="v3-form" onsubmit="return submitScienceTreasure(event)"><div class="v3-field"><label for="treasureTitle">作品标题 *</label><input id="treasureTitle" required placeholder="例如：探访织金洞的喀斯特密码"></div><div class="v3-field"><label for="treasurePlace">科学宝藏地点 *</label><input id="treasurePlace" required placeholder="填写省、市、区县及具体地点"></div><div class="v3-field"><label for="treasureContent">图文内容 *</label><textarea id="treasureContent" required placeholder="写下现场观察、资料来源和科学解释"></textarea></div><button class="v3-upload" type="button" onclick="v3Toast('已选择现场照片（演示）')"><span class="material-symbols-outlined">add_photo_alternate</span>添加现场照片<small style="display:block;margin-top:5px">最多9张，原型不真实上传</small></button><div class="v3-field"><label for="videoMode">视频提交方式</label><select id="videoMode" onchange="toggleScienceVideo(this.value)"><option value="upload">直接上传</option><option value="link">平台链接</option></select></div><button id="scienceVideoUpload" class="v3-upload" type="button" onclick="v3Toast('已选择视频文件（演示）')"><span class="material-symbols-outlined">video_file</span>选择视频文件<small style="display:block;margin-top:5px">建议5分钟以内</small></button><div class="v3-field" id="scienceVideoLink" hidden><label for="videoLink">视频平台链接</label><input id="videoLink" type="url" placeholder="https://"></div><div class="v3-field"><label for="treasureStudent">学生姓名 *</label><input id="treasureStudent" required></div><div class="v3-field"><label for="treasureSchool">学校 *</label><input id="treasureSchool" required></div><label class="v3-note info"><input type="checkbox" required> 我确认内容真实原创，并同意平台审核后刊发。</label><button class="v3-btn" type="submit">提交审核</button></form></main>
<script src="../v3-ui.js?v=20260922-science-v2"></script><script src="../access-control.js?v=20260923-no-bottom-nav-v1"></script><script src="../science.js?v=20260922-science-v2"></script><script src="../routes.js?v=20260922-science-v2"></script></body></html>
