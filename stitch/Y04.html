<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>创作发布</title>
  <link rel="stylesheet" href="../youth.css?v=20260923-no-floating-panels-v3">
  <link rel="stylesheet" href="../v3.css?v=20260923-no-floating-panels-v3">
</head>
<body>
  <header class="topbar">
    <button class="back" aria-label="返回致青春" onclick="youthGo(5)">‹</button>
    <div class="heading"><h1>创作发布</h1><p>致青春创作入口</p></div>
    <span class="more">•••</span>
  </header>
  <main class="page">
    <div class="notice"><b>提交说明</b><br>用于发布“我的大学”内容，或提交贵州教育报主题活动作品。社团入驻请从“多彩社团”进入。</div>
    <form class="card" onsubmit="submitYouthForm(event)">
      <div class="form-group"><label for="youthSchool">学校 <span class="required">*</span></label><select id="youthSchool" required><option>贵州大学</option><option>贵州师范大学</option><option>贵州财经大学</option><option>其他高校</option></select></div>
      <div class="form-group"><label for="youthAuthor">作者姓名 <span class="required">*</span></label><input id="youthAuthor" required value="林溪" placeholder="请输入真实姓名"></div>
      <div class="form-group"><label for="youthTitle">作品标题 <span class="required">*</span></label><input id="youthTitle" required maxlength="40" value="晚风穿过图书馆：我的大学普通一天" placeholder="请输入作品标题"></div>
      <div class="form-group"><label>内容形式 <span class="required">*</span></label><input id="contentType" type="hidden" value="图文"><div class="seg"><button type="button" class="active" onclick="chooseContentType(this,'图文')">图文</button><button type="button" onclick="chooseContentType(this,'短视频')">短视频</button></div></div>
      <div class="form-group"><label for="youthBody">正文或内容简介 <span class="required">*</span></label><textarea id="youthBody" required placeholder="图文请输入正文；短视频请输入内容简介">记录图书馆、食堂和社团排练里真实而温暖的大学日常。</textarea></div>
      <div class="form-group"><label>作品素材 <span class="required">*</span></label><div class="upload" onclick="simulateUpload()"><b id="uploadText">选择图片（最多9张，演示）</b><div class="meta">原型只演示选择状态，不上传真实文件</div></div></div>
      <div class="form-group"><label for="youthDestination">发布到</label><select id="youthDestination"><option>我的大学</option><option>贵州教育报主题活动：我和我的大学</option></select></div>
      <label class="check"><input type="checkbox" required checked aria-label="确认原创授权并同意发布规则"><span>我确认作品为原创或已取得合法授权，并同意按发布规则进行内容展示。<span class="required">*</span></span></label>
      <button class="btn block" type="submit" style="margin-top:18px">确认提交</button>
    </form>
  </main>
  <div class="toast"></div>
  <script>window.EP_PAGE='Y04'</script><script src="../youth.js"></script><script src="../access-control.js?v=20260924-content-actions-v2"></script><script src="../routes.js?v=20260922-v3c21"></script><script src="../v3-overrides.js?v=20260922-v3c21"></script>
</body>
</html>
