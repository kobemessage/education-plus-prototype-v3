<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布社团内容｜教育Plus V3.0</title><link rel="stylesheet" href="../youth.css?v=20260924-youth-platform-v1"><link rel="stylesheet" href="../v3.css?v=20260923-no-floating-panels-v3"></head><body><header class="topbar"><button class="back" aria-label="返回管理员工作台" onclick="youthGo('Y09')">‹</button><div class="heading"><h1>发布社团内容</h1><p>黔青创意社 · 管理员发布</p></div><span class="more">•••</span></header><main class="page"><div class="notice"><b>发布说明</b><br>只有已认证管理员可以提交社团内容。招新和活动动态将在审核通过后进入公开主页及关注动态。</div><form class="card" onsubmit="submitClubPost(event)"><div class="form-group"><label>内容类型 <span class="required">*</span></label><input id="clubPostType" type="hidden" value="招新"><div class="seg three"><button class="active" type="button" onclick="chooseClubPostType(this,'招新')">招新</button><button type="button" onclick="chooseClubPostType(this,'活动动态')">活动动态</button><button type="button" onclick="chooseClubPostType(this,'日常动态')">日常动态</button></div></div><div class="form-group"><label for="clubPostTitle">标题 <span class="required">*</span></label><input id="clubPostTitle" required maxlength="40" value="2026秋季招新：寻找一起做校园设计的人"></div><div class="form-group"><label for="clubPostBody">内容说明 <span class="required">*</span></label><textarea id="clubPostBody" required placeholder="说明对象、时间、地点和参与方式">面向全校招募摄影、平面设计、视频剪辑和活动策划方向的新成员。</textarea></div><div class="form-group"><label for="clubPostTime">时间</label><input id="clubPostTime" placeholder="例如：9月30日前"></div><div class="form-group"><label for="clubPostPlace">地点</label><input id="clubPostPlace" placeholder="例如：大学生活动中心 203"></div><div class="form-group"><label>图文素材</label><div class="upload" id="clubPostUpload" role="button" tabindex="0" onclick="simulateClubPostUpload()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();simulateClubPostUpload()}"><b id="clubPostUploadText">选择图片（最多9张，演示）</b><div class="meta">原型不上传真实文件</div></div></div><label class="check"><input type="checkbox" required checked aria-label="确认内容真实并获得社团授权"><span>我确认内容真实，并已获得社团及学校相关授权。<span class="required">*</span></span></label><button class="btn block" type="submit" style="margin-top:18px">提交平台审核</button></form></main><div class="toast" role="status" aria-live="polite"></div><script>window.EP_PAGE='Y10'</script><script src="../youth.js?v=20260924-youth-platform-v1"></script><script src="../access-control.js?v=20260924-youth-platform-v1"></script><script src="../routes.js?v=20260924-youth-platform-v1"></script><script src="../v3-overrides.js?v=20260924-youth-platform-v1"></script></body></html>
